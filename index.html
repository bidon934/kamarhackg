<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NULLSEC // ROOM 404</title>
<style>
:root{--grn:#00ff9c;--cyn:#00e5ff;--mag:#ff2bd6;--bg:#02050a;--warn:#ffd166;--err:#ff5a7a;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:#cfe9e0;
font-family:var(--mono);font-size:13px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:2px;color:var(--grn);
text-shadow:0 0 12px rgba(0,255,156,.8);font-weight:700;opacity:.9}
.tag b{color:#fff}
#hint{position:absolute;bottom:14px;left:14px;font-size:11px;color:#6a9f8f;letter-spacing:.5px}
.hbtns{position:absolute;top:10px;right:12px;display:flex;gap:6px;pointer-events:auto}
.hbtn{background:rgba(4,16,12,.8);border:1px solid rgba(0,255,156,.35);color:#8affd0;
font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 11px;
border-radius:6px;cursor:pointer;transition:.15s;backdrop-filter:blur(6px)}
.hbtn:hover{background:rgba(0,255,156,.14);border-color:var(--grn);color:#fff}
.hbtn:active{transform:scale(.95)}
#boot{position:fixed;inset:0;z-index:100;background:#010409;display:flex;flex-direction:column;
align-items:center;justify-content:center;transition:opacity .8s,transform .8s}
#boot.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#bootLog{width:min(680px,88vw);height:174px;overflow:hidden;font-size:12px;line-height:1.75;
color:#4dbf9a;z-index:1}
.bl{opacity:0;animation:blIn .3s forwards}@keyframes blIn{to{opacity:1}}
.bl.ok{color:var(--grn);text-shadow:0 0 14px rgba(0,255,156,.9)}
#bootBarWrap{width:min(680px,88vw);margin-top:20px;z-index:1}
#bootBar{height:7px;background:#04120e;border:1px solid #0b3d2e;border-radius:4px;overflow:hidden}
#bootFill{height:100%;width:0%;background:linear-gradient(90deg,#00ff9c,#00d0ff);
box-shadow:0 0 16px var(--grn);transition:width .25s linear}
#bootPct{margin-top:12px;font-size:30px;font-weight:800;letter-spacing:3px;color:var(--grn);
text-shadow:0 0 24px rgba(0,255,156,.9);text-align:center}
#bootTitle{font-size:11px;letter-spacing:5px;color:#2e7a63;margin-bottom:16px;z-index:1}
#os{position:fixed;inset:0;z-index:60;display:none;
background:linear-gradient(135deg,#0a1420,#04121e 40%,#0a0f1a 70%,#12081a);overflow:hidden}
#os.on{display:block;animation:osIn .55s ease}
@keyframes osIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#os::before{content:'';position:absolute;inset:0;pointer-events:none;
background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,.12),transparent 55%),
radial-gradient(ellipse at 75% 80%,rgba(255,43,214,.1),transparent 55%)}
#osGrid{position:absolute;inset:0;pointer-events:none;opacity:.35;
background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);background-size:48px 48px}
.os-top{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;
padding:0 14px;gap:10px;background:rgba(3,10,16,.85);
border-bottom:1px solid rgba(0,255,156,.22);z-index:5;font-size:11.5px;color:#7dffd0}
.os-top .logo{color:var(--grn);font-weight:800;letter-spacing:2px;
text-shadow:0 0 10px var(--grn);display:flex;align-items:center;gap:6px}
.os-top .sp{flex:1}
.os-top .stat{color:#4dbf9a;display:flex;gap:14px;font-size:10.5px}
.os-top .stat span{color:#2e7a63}
.os-top .clock{color:#baffea;font-weight:700;letter-spacing:1px}
.os-top .power{background:rgba(255,60,90,.14);border:1px solid rgba(255,90,122,.5);
color:#ff8fa6;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:1px;
padding:4px 10px;border-radius:4px;cursor:pointer;transition:.15s}
.os-top .power:hover{background:rgba(255,60,90,.35);color:#fff}
#icons{position:absolute;top:56px;left:20px;display:grid;
grid-template-columns:repeat(auto-fill,96px);gap:14px 10px;z-index:2;
max-width:calc(100vw - 40px);align-content:start}
.dicon{width:96px;padding:10px 6px;background:rgba(4,16,20,.55);
border:1px solid rgba(0,255,156,.12);border-radius:10px;cursor:pointer;text-align:center;
transition:.15s;backdrop-filter:blur(4px);user-select:none}
.dicon:hover{background:rgba(0,255,156,.14);border-color:rgba(0,255,156,.55);
transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,255,156,.2)}
.dicon:active{transform:scale(.96)}
.dicon .ic-svg{display:block;width:34px;height:34px;margin:0 auto 8px;color:var(--grn);
filter:drop-shadow(0 0 8px currentColor)}
.dicon .ic-svg svg{width:100%;height:100%}
.dicon .nm{font-size:10px;color:#baffea;font-weight:700;letter-spacing:.3px;
line-height:1.25;word-break:break-word}
.dicon.locked{opacity:.55}
.dicon.locked .ic-svg{color:#7a5555;filter:grayscale(1) drop-shadow(0 0 6px rgba(255,90,122,.6))}
.dicon.locked .nm{color:#7a5555}
.dicon.glow{animation:iconGlow 1.6s infinite alternate}
@keyframes iconGlow{
0%{box-shadow:0 0 12px rgba(255,43,214,.4);border-color:rgba(255,43,214,.4)}
100%{box-shadow:0 0 28px rgba(255,43,214,.9),0 0 60px rgba(255,43,214,.4);
border-color:rgba(255,43,214,.9)}}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;
gap:6px;padding:0 10px;background:rgba(3,10,16,.92);
border-top:1px solid rgba(0,255,156,.28);z-index:10;backdrop-filter:blur(10px)}
#taskbar .start{background:rgba(0,255,156,.16);border:1px solid rgba(0,255,156,.5);
color:var(--grn);font-weight:800;font-size:11px;letter-spacing:1px;padding:7px 12px;
border-radius:6px;cursor:pointer;transition:.15s;font-family:var(--mono);
display:flex;align-items:center;gap:5px}
#taskbar .start:hover{background:rgba(0,255,156,.32);color:#fff}
#tasks{display:flex;gap:5px;flex:1;overflow:hidden}
.task{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#a9c4bd;
font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:5px;cursor:pointer;
transition:.15s;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;
font-family:var(--mono);display:flex;align-items:center;gap:5px}
.task:hover{background:rgba(0,255,156,.14);color:#fff;border-color:rgba(0,255,156,.4)}
.task.active{background:rgba(0,229,255,.25);border-color:var(--cyn);color:#fff;
box-shadow:0 0 10px rgba(0,229,255,.4)}
.task.minimized{opacity:.55;font-style:italic}
#tbClock{color:#baffea;font-weight:700;font-size:12px;padding:0 8px;letter-spacing:.5px}
.os-window{position:absolute;background:rgba(6,14,20,.97);
border:1px solid rgba(0,229,255,.38);border-radius:8px;
box-shadow:0 22px 70px rgba(0,0,0,.7),0 0 0 1px rgba(0,255,156,.08);
display:flex;flex-direction:column;overflow:hidden;min-width:340px;min-height:220px;
animation:winIn .28s ease;z-index:100}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.win-title{height:34px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;
background:linear-gradient(180deg,rgba(0,229,255,.14),rgba(0,255,156,.06));
border-bottom:1px solid rgba(0,229,255,.28);cursor:grab;user-select:none;flex:0 0 auto}
.win-title.drag{cursor:grabbing}
.win-title .ic{width:16px;height:16px;color:var(--grn);flex:0 0 auto;
filter:drop-shadow(0 0 4px currentColor)}
.win-title .ic svg{width:100%;height:100%}
.win-title .tt{font-size:11.5px;font-weight:700;color:#d6fff2;letter-spacing:.4px;flex:1;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-title .ctl{display:flex;gap:4px}
.win-title .ctl button{background:transparent;border:none;color:#7dffd0;
font-family:var(--mono);font-size:13px;width:22px;height:22px;border-radius:4px;
cursor:pointer;line-height:1;padding:0}
.win-title .ctl button:hover{background:rgba(255,255,255,.12)}
.win-title .ctl .cls:hover{background:rgba(255,90,122,.35);color:#fff}
.win-body{flex:1;overflow:auto;position:relative}
.app-term{background:rgba(1,4,7,.98);padding:12px 14px;height:100%;font-size:12px;
line-height:1.75;color:#8affd0;white-space:pre-wrap;overflow:auto;scrollbar-width:thin}
.hl.cmd{color:#e9fff7;font-weight:700}.hl.dim{color:#3f7a68}
.hl.out{color:#6fe8bd}.hl.ok{color:#00ff9c;text-shadow:0 0 12px rgba(0,255,156,.7)}
.hl.warn{color:#ffd166}.hl.err{color:#ff5a7a}
.hl.big{color:#fff;font-weight:800;letter-spacing:1px}
.app-sys{padding:16px;display:flex;flex-direction:column;gap:14px;height:100%}
.sysbar{display:flex;flex-direction:column;gap:6px}
.sysbar .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:#7dffd0;font-weight:700}
.sysbar .lbl span{color:#00ff9c}
.sysbar .track{height:14px;background:rgba(0,255,156,.08);border:1px solid rgba(0,255,156,.15);
border-radius:4px;overflow:hidden}
.sysbar .fill{height:100%;transition:width .2s,background .2s}
#sysCanvas{width:100%;height:auto;background:rgba(0,0,0,.35);
border:1px solid rgba(0,255,156,.15);border-radius:6px}
.app-radar{display:flex;flex-direction:column;align-items:center;height:100%;padding:12px;gap:10px}
#radarCanvas{border-radius:8px;background:radial-gradient(circle,#031514,#01080a 70%);
border:1px solid rgba(0,255,156,.3)}
.radar-info{font-size:11px;color:#4dbf9a;display:flex;gap:18px;justify-content:center}
.radar-info b{color:var(--grn)}
.app-code{height:100%;overflow:hidden;position:relative;background:#03080e;padding:10px 14px;
font-size:12px;line-height:1.65;font-family:var(--mono)}
.app-code pre{margin:0;white-space:pre;color:#8affd0}
.kw{color:#ff2bd6;font-weight:700}.def{color:#00e5ff;font-weight:700}
.str{color:#ffd166}.dim2{color:#3f7a68}
.ln{color:#2e7a63;user-select:none;display:inline-block;width:22px;text-align:right;margin-right:10px}
.cursor{display:inline-block;width:8px;height:14px;background:var(--grn);
animation:blinkCur .7s infinite;vertical-align:middle}
@keyframes blinkCur{50%{opacity:0}}
.app-cipher{height:100%;display:flex;flex-direction:column;padding:16px;gap:14px;
background:radial-gradient(ellipse at top,rgba(0,255,156,.08),transparent 60%)}
#cipherGrid{flex:1;display:grid;grid-template-columns:repeat(26,1fr);gap:0;font-size:10px;
color:rgba(0,255,156,.25);overflow:hidden;font-family:var(--mono);line-height:1.5}
.cipher-out{font-size:14px;font-weight:800;color:var(--grn);letter-spacing:1.5px;
text-shadow:0 0 14px var(--grn);min-height:22px;padding:6px 0;
border-top:1px solid rgba(0,255,156,.2)}
.cipher-out .blind{color:#2e7a63}
.cipher-status{font-size:10.5px;color:#4dbf9a;display:flex;gap:14px;flex-wrap:wrap}
.app-cam{height:100%;display:flex;flex-direction:column;background:#000;position:relative;overflow:hidden}
.app-cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-overlay{position:absolute;inset:0;pointer-events:none;
background:repeating-linear-gradient(0deg,rgba(0,255,156,.06) 0 1px,transparent 1px 3px),
radial-gradient(ellipse,transparent 40%,rgba(0,0,0,.55));
box-shadow:inset 0 0 90px rgba(0,255,156,.28)}
.cam-info{position:absolute;top:10px;left:12px;font-size:11px;color:var(--grn);
text-shadow:0 0 8px var(--grn);font-weight:700}
.cam-rec{position:absolute;top:10px;right:12px;font-size:11px;color:#ff5a7a;
font-weight:700;display:flex;align-items:center;gap:6px}
.cam-rec::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff5a7a;
animation:blinkCur 1s infinite}
.cam-time{position:absolute;bottom:10px;left:12px;font-size:11px;color:var(--grn);
font-weight:700}
.cam-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;color:#3f7a68;font-size:12px;text-align:center;padding:20px;gap:12px}
.cam-fallback .big{font-size:44px;opacity:.5}
.cam-fallback button{margin-top:10px;background:rgba(0,255,156,.15);
border:1px solid rgba(0,255,156,.5);color:var(--grn);font-family:var(--mono);font-size:11px;
font-weight:800;padding:8px 16px;border-radius:6px;cursor:pointer;letter-spacing:1px}
.app-chat{display:flex;flex-direction:column;height:100%;background:#03080e}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5;
animation:msgIn .3s}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:rgba(0,229,255,.18);border:1px solid rgba(0,229,255,.4);
color:#a5f0ff;border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:rgba(255,43,214,.12);
border:1px solid rgba(255,43,214,.35);color:#ffb0f0;border-bottom-left-radius:3px}
.msg .who{font-size:10px;opacity:.65;margin-bottom:3px;font-weight:800;letter-spacing:.5px}
.msg.typing{color:#7dffd0;font-style:italic;background:rgba(0,255,156,.08)}
.chat-input{display:flex;gap:6px;padding:8px 10px;border-top:1px solid rgba(0,255,156,.2);
background:rgba(3,10,16,.9)}
.chat-input input{flex:1;background:rgba(0,255,156,.06);
border:1px solid rgba(0,255,156,.28);color:#d6fff2;font-family:var(--mono);font-size:12px;
padding:8px 12px;border-radius:6px;outline:none}
.chat-input button{background:rgba(0,255,156,.2);border:1px solid var(--grn);color:var(--grn);
font-weight:800;font-size:11px;padding:8px 14px;border-radius:6px;cursor:pointer;letter-spacing:1px}
.app-hack{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:100%;
background:linear-gradient(180deg,rgba(30,10,20,.5),rgba(3,8,14,.95));overflow:hidden}
.hm-header{padding:12px 18px;border-bottom:1px solid rgba(255,43,214,.3);
background:linear-gradient(90deg,rgba(255,43,214,.15),rgba(0,229,255,.08))}
.hm-header .tt{font-size:16px;font-weight:900;letter-spacing:2px;color:#fff;
text-shadow:0 0 16px rgba(255,43,214,.9)}
.hm-header .sub{font-size:10px;color:#ff8fa6;letter-spacing:2px;margin-top:3px}
.hm-target{margin-top:6px;font-size:10.5px;color:#a5a0c0;display:flex;gap:14px;
align-items:center;flex-wrap:wrap}
.hm-target .badge{background:rgba(0,255,156,.15);border:1px solid rgba(0,255,156,.4);
color:#00ff9c;padding:2px 8px;border-radius:10px;font-size:9.5px;letter-spacing:1px;
font-weight:800}
.hm-body{padding:14px 18px;overflow-y:auto;display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cheat{padding:9px 12px;border-radius:7px;background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;
gap:8px;transition:.18s;cursor:pointer;font-size:11.5px;color:#c4d6e0;font-weight:600}
.cheat:hover{background:rgba(255,43,214,.08);border-color:rgba(255,43,214,.35)}
.cheat.on{background:rgba(0,255,156,.14);border-color:rgba(0,255,156,.55);color:#d6fff2}
.cheat .nm{flex:1;display:flex;align-items:center;gap:8px}
.cheat .ci{width:16px;height:16px;color:#7dffd0;flex:0 0 auto;filter:drop-shadow(0 0 4px currentColor)}
.cheat.on .ci{color:var(--grn)}
.cheat .ci svg{width:100%;height:100%}
.cheat .tg{width:30px;height:16px;background:rgba(255,255,255,.14);border-radius:8px;
position:relative;transition:.2s;flex:0 0 auto}
.cheat .tg::before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;
background:#fff;top:2px;left:2px;transition:.2s}
.cheat.on .tg{background:var(--grn)}
.cheat.on .tg::before{transform:translateX(14px)}
.hm-footer{padding:12px 18px;border-top:1px solid rgba(255,43,214,.3);
background:rgba(3,8,14,.85);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hm-footer .prog{flex:1;min-width:120px;height:10px;background:rgba(255,43,214,.1);
border:1px solid rgba(255,43,214,.3);border-radius:5px;overflow:hidden}
.hm-footer .fill{height:100%;width:0%;background:linear-gradient(90deg,#ff2bd6,#00e5ff);
transition:width .25s}
.hm-btn{font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:1.5px;
padding:10px 20px;border-radius:6px;cursor:pointer;transition:.18s;border:1px solid;
white-space:nowrap}
.hm-btn.inject{background:rgba(255,43,214,.2);border-color:var(--mag);color:#ffb0f0}
.hm-btn.inject:hover{background:var(--mag);color:#fff}
.hm-btn.inject:disabled{opacity:.4;cursor:not-allowed}
.hm-btn.launch{background:rgba(0,255,156,.2);border-color:var(--grn);color:var(--grn);
animation:launchPulse 1.4s infinite alternate;display:none}
.hm-btn.launch.show{display:block}
@keyframes launchPulse{0%{box-shadow:0 0 12px rgba(0,255,156,.4)}
100%{box-shadow:0 0 32px rgba(0,255,156,.9)}}
.hm-status{font-size:10.5px;color:#7dffd0;padding:6px 0 0;grid-column:1/-1;
font-family:var(--mono);min-height:16px}
.app-mlbb{height:100%;display:flex;flex-direction:column;background:#0a0f1c;
overflow:hidden;position:relative}
.mlbb-load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;background:linear-gradient(160deg,#1a0e2e,#0c0820 50%,#0a1a2e);
gap:20px;z-index:5}
.mlbb-load.gone{display:none}
.mlbb-logo{font-size:34px;font-weight:900;letter-spacing:3px;
background:linear-gradient(90deg,#ffd166,#ff2bd6,#00e5ff,#ffd166);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 24px rgba(255,43,214,.7));text-align:center;line-height:1.1}
.mlbb-load .bar{width:min(320px,70%);height:6px;background:rgba(255,255,255,.1);
border-radius:3px;overflow:hidden}
.mlbb-load .fill{height:100%;width:0%;
background:linear-gradient(90deg,#ffd166,#ff2bd6,#00e5ff);transition:width .3s}
.mlbb-load .tip{font-size:11px;color:#a5a0c0;letter-spacing:1px}
.mlbb-hud{flex:0 0 auto;padding:8px 14px;background:linear-gradient(90deg,#1a0e2e,#0c0820);
border-bottom:1px solid rgba(255,43,214,.35);display:flex;align-items:center;gap:12px;
font-size:11px;color:#e0d8ff;font-weight:800;letter-spacing:.5px}
.mlbb-hud .sc{color:#ffd166;font-size:14px}
.mlbb-hud .tm{color:#a5a0c0;font-family:var(--mono)}
.mlbb-hud .sp{flex:1}
.mlbb-hud .kb{color:#00ff9c}
#mlbbCanvas{flex:1 1 auto;width:100%;background:radial-gradient(ellipse at center,#1a2540,#060912 70%);
display:block;touch-action:none}
.mlbb-foot{flex:0 0 auto;padding:8px 14px;background:linear-gradient(90deg,#0c0820,#1a0e2e);
border-top:1px solid rgba(255,43,214,.35);display:flex;gap:12px;align-items:center;font-size:11px}
.mlbb-foot .ability{width:38px;height:38px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#ffd166,#8a5c10);border:2px solid #ffd166;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 0 14px rgba(255,209,102,.6);color:#1a0e2e}
.mlbb-foot .ability:active{transform:scale(.92)}
.mlbb-foot .ability svg{width:20px;height:20px}
.mlbb-foot .stats{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.mlbb-foot .hp{height:11px;background:rgba(255,90,122,.15);
border:1px solid rgba(255,90,122,.4);border-radius:5px;overflow:hidden}
.mlbb-foot .hp>div{height:100%;width:100%;
background:linear-gradient(90deg,#ff5a7a,#ff8fa6);transition:width .2s}
.mlbb-foot .mp{height:8px;background:rgba(0,229,255,.12);
border:1px solid rgba(0,229,255,.4);border-radius:4px;overflow:hidden}

/* ============ UTILS ============ */

const easeOutCubic = t => 1 - Math.pow(1-t,3);

const tweens = [];
function tweenTo(dur,onUpdate,ease=easeInOutCubic){
  return new Promise(resolve=>{tweens.push({t:0,dur,onUpdate,ease,resolve})});
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const raw=Math.min(1,tw.t/tw.dur);
    try{tw.onUpdate(tw.ease(raw),raw)}catch(e){console.error(e)}

  }
}

/* ============ SVG ICONS ============ */

/* ============ THREE SETUP ============ */
const canvas = $('c');

let camLocked = false;
async function camTo(pos,tgt,dur=1.4,ease=easeInOutCubic){
  camLocked = true;
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  await tweenTo(dur, e => {
    camera.position.lerpVectors(p0,pos,e);
    controls.target.lerpVectors(t0,tgt,e);

const HEXC = '0123456789ABCDEF';
const rh = n => {let s='';for(let i=0;i<n;i++)s+=HEXC[Math.floor(Math.random()*16)];return s};
const screenLines = [];
function pushLine(){
  const r=Math.random();
  if(r<.34) return '0x'+rh(6)+'  '+Array.from({length:6},()=>rh(2)).join(' ');
  if(r<.60) return '$ '+['sudo ./inject --pid 4192','ssh root@10.13.37.42','nc -lvnp 9001',
    'python3 exp.py -t 10.13.37.42'][Math.floor(Math.random()*4)];
  if(r<.86) return '['+(Math.random()<.62?'OK':'!!')+'] '+['packet captured','handshake verified',
    'tunnel up','key injected','firewall bypassed','node synced'][Math.floor(Math.random()*6)];
  return '>> '+rh(4)+' pkts / '+Math.floor(Math.random()*999)+'ms';
}
function drawScreenTex(){
  pushLine(); if(Math.random()<.5) pushLine();
  while(screenLines.length>12) screenLines.shift();
  const g=sctx;
  g.fillStyle='#02070a'; g.fillRect(0,0,512,320);
  g.fillStyle='rgba(0,255,150,.028)';
  for(let y=0;y<320;y+=4) g.fillRect(0,y,512,1);

  g.fillText('root@nullsec:~# tail -f /var/log/breach',10,17);
  g.font='13px monospace';
  for(let i=0;i<screenLines.length;i++){
    const L=screenLines[i];
    g.fillStyle = L.includes('!!')?'#ff5a7a':L.startsWith('$')?'#7dffd0':'#00d18a';
    g.fillText(L,10,44+i*19);
  }
  if(Math.floor(performance.now()/430)%2===0){
    g.fillStyle='#00ffaa'; g.fillRect(10,44+screenLines.length*19-12,8,14);
  }
  screenTex.needsUpdate=true;
}

function updateCharacter(dt,time){
  const k = 1-Math.exp(-14*dt);
  for(const n in rig){
    const r=rig[n];
    r.cur[0]+=(r.tgt[0]-r.cur[0])*k;
    r.cur[1]+=(r.tgt[1]-r.cur[1])*k;
    r.cur[2]+=(r.tgt[2]-r.cur[2])*k;
    r.obj.rotation.set(r.cur[0],r.cur[1],r.cur[2]);
  }
  hipsY.cur += (hipsY.tgt-hipsY.cur)*k;
  hips.position.y = hipsY.cur;
  if(walking){
    const s=Math.sin(time*11);
    rig.hipL.obj.rotation.x=s*.62; rig.hipR.obj.rotation.x=-s*.62;
    rig.kneeL.obj.rotation.x=Math.max(0,-s)*.95+.08;
    rig.kneeR.obj.rotation.x=Math.max(0,s)*.95+.08;
    rig.shoulderL.obj.rotation.x=-s*.45; rig.shoulderR.obj.rotation.x=s*.45;
    hips.position.y = hipsY.cur + Math.abs(Math.cos(time*11))*.026;
  }
  if(typing){
    const s=Math.sin(time*16);
    rig.elbowL.obj.rotation.x += s*.12;
    rig.elbowR.obj.rotation.x -= s*.12;
    rig.head.obj.rotation.y = Math.sin(time*.8)*.05;
  }
  if(!walking && !typing && charState==='idle'){
    rig.torso.obj.rotation.x += Math.sin(time*1.7)*.014;
    rig.head.obj.rotation.y += Math.sin(time*.55)*.06;
  }
  if(charState==='sleeping'){
    tilt.position.y = Math.sin(time*1.4)*0.012;
    rig.head.obj.rotation.z += Math.sin(time*.35)*0.06;
    rig.head.obj.rotation.x += Math.sin(time*.28)*0.03;
    rig.elbowL.obj.rotation.x += Math.sin(time*.55)*0.05;
    rig.elbowR.obj.rotation.x += Math.sin(time*.55+1)*0.05;
  } else if(Math.abs(tilt.position.y)>0.001){
    tilt.position.y *= 0.85;
    if(Math.abs(tilt.position.y)<0.001) tilt.position.y = 0;
  }
}

async function faceTo(angle,dur=.35){
  const a0=character.rotation.y;
  const d=shortestAngle(a0,angle);
  await tweenTo(dur,e=>{character.rotation.y=a0+d*e},easeInOutSine);
}
async function walkTo(tx,tz,faceAngle){
  const sx=character.position.x, sz=character.position.z;
  const dist=Math.hypot(tx-sx,tz-sz);
  if(dist<.04){ if(faceAngle!==undefined) await faceTo(faceAngle); return; }
  walking = true;
  const dur = Math.min(3.6, Math.max(.42, dist/1.35));
  const dir = Math.atan2(tx-sx, tz-sz);
  const a0 = character.rotation.y;
  const dA = shortestAngle(a0, dir);
  await tweenTo(dur, e => {
    character.position.x = sx+(tx-sx)*e;
    character.position.z = sz+(tz-sz)*e;
    const rk = Math.min(1, e/.18);
    character.rotation.y = a0 + dA*rk;
  }, t => t);
  walking = false;
  if(faceAngle!==undefined) await faceTo(faceAngle);
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downPt = null;
function pickActionAt(cx,cy){
  const r = canvas.getBoundingClientRect();
  ndc.x = ((cx-r.left)/r.width)*2-1;
  ndc.y = -((cy-r.top)/r.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const hits = raycaster.intersectObjects(interactive,true);
  for(const h of hits){
    let n = h.object;
    while(n){
      if(n.userData && n.userData.action) return n.userData.action;
      n = n.parent;
    }
  }
  return null;
}
canvas.addEventListener('pointerdown', e => { downPt = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', e => {
  if(!downPt) return;
  const d = Math.hypot(e.clientX-downPt.x, e.clientY-downPt.y);
  downPt = null;
  if(d>9 || osOpen) return;
  const action = pickActionAt(e.clientX,e.clientY);
  if(action && ACTIONS[action]) ACTIONS[action]();
});
let hoverT = 0;
canvas.addEventListener('pointermove', e => {
  const now = performance.now();
  if(now-hoverT<90) return;
  hoverT = now;
  if(osOpen){ canvas.style.cursor='default'; return; }
  canvas.style.cursor = pickActionAt(e.clientX,e.clientY) ? 'pointer' : 'grab';
});

/* ============ OS ============ */
let osOpen = false;
let winCount = 0;
let zTop = 100;
const windows = new Map();
const tasksEl = $('tasks');

function createWindow(id, title, iconName, buildContent){
  if(windows.has(id)){
    const w = windows.get(id);
    if(w.minimized) toggleMinimize(id);
    bringToFront(id);
    return w;
  }
  const el = document.createElement('div');
  el.className = 'os-window';
  const w = 640, h = 420;
  const maxX = Math.max(20, innerWidth - w - 20);
  const maxY = Math.max(50, innerHeight - h - 80);
  const ox = 60 + (winCount*26)%Math.max(1, maxX-60);
  const oy = 60 + (winCount*22)%Math.max(1, maxY-60);
  el.style.left = ox+'px'; el.style.top = oy+'px';
  el.style.width = Math.min(w, innerWidth-40)+'px';
  el.style.height = Math.min(h, innerHeight-120)+'px';
  el.innerHTML = `
    <div class="win-title">
      <span class="ic">${svgIcon(iconName, 16)}</span>
      <span class="tt">${title}</span>
      <div class="ctl">
        <button class="min">–</button>
        <button class="cls">×</button>
      </div>
    </div>
    <div class="win-body"></div>`;
  $('windows').appendChild(el);
  winCount++;
  const titleBar = el.querySelector('.win-title');
  const body = el.querySelector('.win-body');
  buildContent(body);

  let dragging=false, sx=0, sy=0, sl=0, st=0;
  titleBar.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    dragging=true; sx=e.clientX; sy=e.clientY; sl=el.offsetLeft; st=el.offsetTop;
    titleBar.classList.add('drag'); el.style.zIndex = ++zTop;
    titleBar.setPointerCapture(e.pointerId);
  });
  titleBar.addEventListener('pointermove', e => {
    if(!dragging) return;
    el.style.left = Math.max(0, Math.min(innerWidth-el.offsetWidth, sl+(e.clientX-sx)))+'px';
    el.style.top  = Math.max(34, Math.min(innerHeight-44-el.offsetHeight, st+(e.clientY-sy)))+'px';
  });
  titleBar.addEventListener('pointerup', e => {
    dragging=false; titleBar.classList.remove('drag');
    try{titleBar.releasePointerCapture(e.pointerId)}catch(err){}
  });

  el.querySelector('.cls').addEventListener('click', () => closeWindow(id));
  el.querySelector('.min').addEventListener('click', () => toggleMinimize(id));
  el.addEventListener('pointerdown', () => bringToFront(id));

  const task = document.createElement('button');
  task.className = 'task';
  task.innerHTML = svgIcon(iconName, 11) + ' ' + title;
  task.addEventListener('click', () => {
    const w2 = windows.get(id); if(!w2) return;
    if(w2.minimized) toggleMinimize(id);
    else if(w2.el.style.zIndex == zTop) toggleMinimize(id);
    else bringToFront(id);
  });
  tasksEl.appendChild(task);

  const wObj = { el, body, task, minimized:false, id };
  windows.set(id, wObj);
  bringToFront(id);
  return wObj;
}
function bringToFront(id){
  const w = windows.get(id); if(!w) return;
  w.el.style.zIndex = ++zTop;
  w.el.style.display = '';
  w.minimized = false;
  w.task.classList.remove('minimized');
  windows.forEach((ww,k)=>{
    ww.task.classList.toggle('active', k===id && ww.el.style.zIndex == zTop);
  });
}
function toggleMinimize(id){
  const w = windows.get(id); if(!w) return;
  w.minimized = !w.minimized;
  w.el.style.display = w.minimized ? 'none' : '';
  w.task.classList.toggle('minimized', w.minimized);
}
function closeWindow(id){
  const w = windows.get(id); if(!w) return;
  w.el.remove(); w.task.remove(); windows.delete(id);
  if(w.stopRAF) w.stopRAF();
  if(w.stopCam) w.stopCam();
}

APPS.radar = {
  title:'Network Radar', icon:'radar',
  build: body => {
    body.innerHTML = `
      <div class="app-radar">
        <canvas id="radarCanvas" width="380" height="380"></canvas>
        <div class="radar-info">
          <span>NODES <b>9</b></span>
          <span>SCANNING <b>10.13.37.0/24</b></span>
          <span>LATENCY <b id="rLat">24ms</b></span>
        </div>
      </div>`;
    const cv=$('radarCanvas'), ctx=cv.getContext('2d');
    const blips = Array.from({length:9},(_,i)=>({
      a:(i/9)*Math.PI*2+Math.random()*.6, r:.22+Math.random()*.72
    }));
    let raf, last=0, t=0;
    function loop(now){
      raf = requestAnimationFrame(loop);
      if(now-last<30) return; last=now;
      t += .05;
      const w=cv.width, h=cv.height, cx=w/2, cy=h/2, R=Math.min(w,h)/2-20;
      ctx.fillStyle='#01080a'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='rgba(0,255,156,.22)'; ctx.lineWidth=1;
      for(let r=40;r<=R;r+=40){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
      const a = t;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
      grad.addColorStop(0,'rgba(0,255,156,.6)');
      grad.addColorStop(1,'rgba(0,255,156,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a-.6,a);ctx.closePath();ctx.fill();
      blips.forEach(b=>{
        const diff = Math.abs(((a-b.a)+Math.PI*3)%(Math.PI*2)-Math.PI);
        const inten = diff<.55?1-diff/.55:0;
        const px = cx+Math.cos(b.a)*b.r*R, py = cy+Math.sin(b.a)*b.r*R;
        if(inten>0){
          ctx.fillStyle=`rgba(0,255,156,${inten})`;
          ctx.beginPath();ctx.arc(px,py,3+inten*4,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='rgba(0,229,255,.4)';
        ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fill();
      });
      $('rLat').textContent = (20+Math.random()*10).toFixed(0)+'ms';
    }
    raf = requestAnimationFrame(loop);
    const wObj = windows.get('radar');
    if(wObj) wObj.stopRAF = ()=>cancelAnimationFrame(raf);
  }
};

/* ============ MLBB LAUNCH (DUAL DEEP LINK FALLBACK) ============ */
async function launchMLBB(){
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  
  if(!isAndroid){
    toast(isIOS ? 'iOS tidak support intent — menjalankan simulasi' : 'Desktop — menjalankan simulasi MLBB');
    launchMiniGame();
    return;
  }
  
  // Varian package MLBB (coba berurutan)
  const PACKAGES = [
    'com.mobile.legends',        // Global
    'com.mobile.legends.id',     // Indonesia
    'com.mobilelegends.id',      // Indonesia (alt)
    'com.vng.mlbbvn',            // Vietnam
    'com.mobilelegends.mi'       // MIUI / China
  ];
  
  // Deep link fallback (dicoba kalau semua intent gagal)
  const DEEP_LINKS = [
    'https://applink.mobilelegends.com',
    'https://applink.mobilelegends.com'
  ];
  
  toast('Mendeteksi MLBB...');
  
  // Deteksi app benar-benar terbuka
  let launched = false;
  const onVis = () => { if(document.hidden) launched = true; };
  const onBlur = () => { launched = true; };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('blur', onBlur);
  
  const cleanup = () => {
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('blur', onBlur);
  };
  
  // ---- Tahap 1: Coba intent package MLBB ----
  for(let i = 0; i < PACKAGES.length; i++){
    if(launched || document.hidden){ cleanup(); return; }
    const pkg = PACKAGES[i];
    console.log(`[MLBB] Trying package: ${pkg}`);
    toast(`Mencoba: ${pkg}...`);
    
    const intentUrl = 
      'intent:#Intent;' +
      `package=${pkg};` +
      'action=android.intent.action.MAIN;' +
      'category=android.intent.category.LAUNCHER;' +
      'launchFlags=0x10000000;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://play.mobilelegends.com/') +
      ';end';
    
    try { window.location.href = intentUrl; } catch(e){}
    
    // Tunggu 700ms — kalau app kebuka, halaman jadi hidden/blur
    await sleep(700);
    
    if(launched || document.hidden){
      cleanup();
      toast('MLBB terbuka! (' + pkg + ')');
      return;
    }
  }
  
  // ---- Tahap 2: Coba deep link play.mobilelegends.com ----
  if(!launched && !document.hidden){
    console.log('[MLBB] Trying deep link: applink.mobilelegends.com');
    toast('Membuka applink.mobilelegends.com...');
    
    try { window.location.href = DEEP_LINKS[0]; } catch(e){}
    
    await sleep(1000);
    
    if(launched || document.hidden){
      cleanup();
      toast('MLBB terbuka via applink.mobilelegends.com');
      return;
    }
  }
  
  // ---- Tahap 3: Coba deep link applink.mobilelegends.com ----
  if(!launched && !document.hidden){
    console.log('[MLBB] Trying deep link: applink.mobilelegends.com');
    toast('Membuka applink.mobilelegends.com...');
    
    try { window.location.href = DEEP_LINKS[1]; } catch(e){}
    
    await sleep(1000);
    
    if(launched || document.hidden){
      cleanup();
      toast('MLBB terbuka via applink.mobilelegends.com');
      return;
    }
  }
  
  // ---- Tahap 4: Semua gagal → mini-game simulasi ----
  cleanup();
  toast('MLBB tidak terdeteksi — menjalankan simulasi');
  launchMiniGame();
}

function startMLBBGame(){
  const cv = $('mlbbCanvas'), container = cv.parentElement;
  const W = container.clientWidth || 640, H = container.clientHeight || 320;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const game = {
    W, H, ctx,
    player: {x:W/2, y:H/2, hp:100, mp:100},
    enemies: [], projectiles: [], particles: [],
    kills: 0, time: 0, lastShot: 0, running: true,
    aimbot: true, esp: true
  };
  function spawn(){
    game.enemies = [];
    for(let i=0;i<5;i++){
      const a = Math.random()*Math.PI*2, r = Math.min(W,H)*.35;
      game.enemies.push({
        x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r,
        vx:(Math.random()-.5)*80, vy:(Math.random()-.5)*80,
        hp:100, alive:true,
        hero:['Layla','Zilong','Miya','Alucard','Gusion','Fanny','Lesley'][Math.floor(Math.random()*7)]
      });
    }
  }
  spawn();
  let raf = null, last = performance.now();
  function tick(){
    if(!game.running) return;
    const now = performance.now(), dt = Math.min(.05, (now-last)/1000);
    last = now; game.time += dt;

    game.enemies.forEach(e => {
      if(!e.alive) return;
      e.x += e.vx*dt; e.y += e.vy*dt;
      if(e.x<24||e.x>W-24) e.vx *= -1;
      if(e.y<24||e.y>H-24) e.vy *= -1;
      e.x += (game.player.x - e.x)*dt*.15;
      e.y += (game.player.y - e.y)*dt*.15;
    });

    if(game.aimbot && game.time-game.lastShot>.45){
      const t = game.enemies.filter(e=>e.alive).sort((a,b)=>
        Math.hypot(a.x-game.player.x,a.y-game.player.y) - Math.hypot(b.x-game.player.x,b.y-game.player.y))[0];
      if(t){
        game.lastShot = game.time;
        const dx=t.x-game.player.x, dy=t.y-game.player.y;
        const d = Math.hypot(dx,dy)||1;
        game.projectiles.push({x:game.player.x,y:game.player.y,vx:dx/d*520,vy:dy/d*520,life:1});
      }
    }
    game.projectiles = game.projectiles.filter(p => {
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      for(const e of game.enemies){
        if(!e.alive) continue;
        if(Math.hypot(e.x-p.x,e.y-p.y)<16){
          e.hp -= 45;
          if(e.hp<=0){
            e.alive=false; game.kills++;
            for(let i=0;i<10;i++) game.particles.push({
              x:e.x, y:e.y, vx:(Math.random()-.5)*200, vy:(Math.random()-.5)*200, life:.6
            });
          }
          return false;
        }
      }
      return p.life>0 && p.x>-20 && p.x<W+20 && p.y>-20 && p.y<H+20;
    });
    game.particles = game.particles.filter(p => {
      p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
      return p.life > 0;
    });
    if(game.enemies.filter(e=>e.alive).length<2 && !game._respawning){
      game._respawning = true;
      setTimeout(()=>{spawn(); game._respawning=false;},1500);
    }
    if(game.kills>=15 && !game._victory){
      game._victory = true;
      $('mlVictory').classList.add('show');
    }
    $('mlKill').textContent = game.kills;
    const mm = Math.floor(game.time/60), ss = Math.floor(game.time%60);
    $('mlTimer').textContent = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');

    ctx.fillStyle = '#0a1020'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(0,229,255,.08)';
    for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.strokeStyle = 'rgba(255,209,102,.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W/2,H/2,60,0,Math.PI*2); ctx.stroke();

    if(game.esp){
      game.enemies.forEach(e => {
        if(!e.alive) return;
        ctx.strokeStyle = 'rgba(255,43,214,.85)'; ctx.lineWidth = 1.5;
        ctx.strokeRect(e.x-14, e.y-14, 28, 28);
        ctx.fillStyle = 'rgba(255,43,214,.9)';
        ctx.font = '9px monospace'; ctx.textAlign = 'center';
        ctx.fillText(e.hero, e.x, e.y-20);
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x-14, e.y+16, 28, 3);
        ctx.fillStyle = '#00ff9c'; ctx.fillRect(e.x-14, e.y+16, 28*(e.hp/100), 3);
      });
    }
    if(game.aimbot){
      const t = game.enemies.filter(e=>e.alive).sort((a,b)=>
        Math.hypot(a.x-game.player.x,a.y-game.player.y) - Math.hypot(b.x-game.player.x,b.y-game.player.y))[0];
      if(t){
        ctx.strokeStyle = 'rgba(0,255,156,.5)'; ctx.lineWidth = 1;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(game.player.x, game.player.y); ctx.lineTo(t.x, t.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,209,102,.9)';
        ctx.beginPath(); ctx.arc(t.x, t.y, 18, 0, Math.PI*2); ctx.stroke();
      }
    }
    game.projectiles.forEach(p => {
      ctx.fillStyle = '#ffd166'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    });
    game.particles.forEach(p => {
      ctx.fillStyle = `rgba(255,43,214,${p.life/.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = '#00e5ff'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(game.player.x, game.player.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('YOU', game.player.x, game.player.y+3);

    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  $('mlExit').addEventListener('click', () => {
    game.running = false; cancelAnimationFrame(raf);
    $('mlVictory').classList.remove('show');
    closeWindow('mlbb');
    toast('Keluar dari MLBB');
  });
  $('mlAgain').addEventListener('click', () => {
    $('mlVictory').classList.remove('show');
    game.kills = 0; game.enemies = []; game.projectiles = []; game._victory = false;
    spawn();
  });
}

function updateClockHands(){
  const d = new Date();
  const s = d.getSeconds()/60*Math.PI*2;
  const m = (d.getMinutes()+d.getSeconds()/60)/60*Math.PI*2;
  const h = ((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2;
  if(clockSec) clockSec.rotation.z = -s;
  if(clockMin) clockMin.rotation.z = -m;
  if(clockHour) clockHour.rotation.z = -h;
}

async function runBoot(){

    '[ INIT  ] Mounting /dev/ram0 ................. OK',

  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  composer.setSize(w,h);
  bloom.setSize(w,h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize, 220));

/* ============ START ============ */
animate();
runBoot();
</script>
</body>
